<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1e293b" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;800;900&family=Roboto+Mono:wght@300;400;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- KaTeX for Professional LaTeX Math & Physics Formatting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
    <title>Aulock Tracker</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error('GLOBAL_AULOCK_ERROR:', e.error || e.message);
        var box = document.getElementById('aulock-global-err-banner');
        if (!box) {
          box = document.createElement('div');
          box.id = 'aulock-global-err-banner';
          box.style = 'position:fixed;top:0;left:0;right:0;z-index:999999;background:#7f1d1d;color:#fee2e2;padding:12px 16px;font-family:monospace;font-size:12px;border-bottom:2px solid #ef4444;box-shadow:0 4px 20px rgba(0,0,0,0.5);display:flex;justify-content:space-between;align-items:center;';
          var textSpan = document.createElement('span');
          textSpan.textContent = '⚠️ Error en arranque: ' + (e.error ? (e.error.message || e.error) : e.message);
          var reloadBtn = document.createElement('button');
          reloadBtn.textContent = '🔄 Forzar Recarga Limpia';
          reloadBtn.style = 'background:#ef4444;color:#fff;border:none;padding:6px 12px;border-radius:6px;font-weight:bold;cursor:pointer;margin-left:12px;';
          reloadBtn.onclick = function() {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var r of regs) r.unregister();
                if ('caches' in window) {
                  caches.keys().then(function(names) {
                    for (var n of names) caches.delete(n);
                    window.location.reload(true);
                  });
                } else {
                  window.location.reload(true);
                }
              });
            } else {
              window.location.reload(true);
            }
          };
          box.appendChild(textSpan);
          box.appendChild(reloadBtn);
          document.body ? document.body.appendChild(box) : document.documentElement.appendChild(box);
        }
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div id="aulock-boot-splash" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #020617; color: #38bdf8; font-family: monospace; text-align: center; padding: 20px;">
        <div style="font-size: 20px; font-weight: 800; margin-bottom: 8px; letter-spacing: 2px;">AULOCK // PLATAFORMA EDUCATIVA</div>
        <div style="font-size: 12px; opacity: 0.8; margin-bottom: 24px;">Sincronizando telemetría y módulos cuánticos...</div>
        <div style="width: 42px; height: 42px; border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
        <div id="aulock-stuck-btn" style="display: none; margin-top: 24px;">
          <button onclick="if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){for(var r of rs)r.unregister();caches.keys().then(function(ns){for(var n of ns)caches.delete(n);location.reload(true);});});}else{location.reload(true);}" style="background: #2563eb; color: #fff; border: 1px solid #60a5fa; padding: 10px 18px; border-radius: 12px; font-family: monospace; font-weight: bold; font-size: 12px; cursor: pointer;">
            🔄 Limpiar Caché & Reiniciar
          </button>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        <script>
          setTimeout(function() {
            var btn = document.getElementById('aulock-stuck-btn');
            if (btn) btn.style.display = 'block';
          }, 3500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
